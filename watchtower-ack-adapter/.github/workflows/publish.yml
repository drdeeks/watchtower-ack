name: Publish @the-federation/adapter

on:
  push:
    branches: [main]
    paths:
      - 'watchtower-ack-adapter/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./watchtower-ack-adapter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: watchtower-ack-adapter/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  publish:
    name: Publish to npm
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: watchtower-ack-adapter/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./watchtower-ack-adapter

      - name: Publish
        run: npm publish --access public --provenance
        working-directory: ./watchtower-ack-adapter
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}